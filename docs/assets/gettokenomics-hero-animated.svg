<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#091E3A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font: 800 36px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 500 17px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #94A3B8; }
      .badge { font: 700 12px 'Consolas', 'Courier New', monospace; fill: #38BDF8; letter-spacing: 1px; }
      .card-title { font: 700 16px 'Segoe UI', system-ui, sans-serif; fill: #E2E8F0; }
      .code { font: 500 13px 'Consolas', 'Courier New', monospace; fill: #CBD5E1; }
      .code-kw { fill: #38BDF8; font-weight: 700; }
      .code-on { fill: #34D399; font-weight: 700; }
      .code-val { fill: #FBBF24; }
      .metric-lbl { font: 600 12px 'Segoe UI', sans-serif; fill: #94A3B8; }
      .metric-val { font: 800 22px 'Consolas', monospace; fill: #F8FAFC; }
      .flow-line {
        stroke: url(#accentGrad);
        stroke-width: 3;
        stroke-dasharray: 10 8;
        fill: none;
        animation: dashFlow 1.6s linear infinite;
      }
      .pulse-dot {
        animation: pulseGlow 2s ease-in-out infinite;
      }
      .bar-anim {
        animation: barGrow 3s ease-in-out infinite alternate;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -36; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.92); }
      }
      @keyframes barGrow {
        0% { width: 220px; }
        100% { width: 278px; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="626" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="44" y="28" width="290" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
  <circle cx="62" cy="42" r="5" fill="#34D399" class="pulse-dot"/>
  <text x="76" y="46" class="badge">ZERO EXTENSION • ZERO ORG APPROVAL</text>

  <!-- LinkedIn & GitHub Author Badge (Top Right) -->
  <rect x="756" y="28" width="400" height="28" rx="14" fill="#0A66C2" fill-opacity="0.28" stroke="#38BDF8" stroke-width="1"/>
  <rect x="768" y="33" width="18" height="18" rx="4" fill="#0A66C2"/>
  <text x="772" y="46" font-family="Segoe UI, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">in</text>
  <text x="794" y="46" class="badge" fill="#E2E8F0">https://www.linkedin.com/in/shahabm/</text>

  <text x="44" y="96" class="title">GetTokenomics for GitHub Copilot</text>
  <text x="44" y="126" class="subtitle">Automatic Per-Prompt Token, Cache Hit % &amp; AIU/AIC Credit Telemetry via Local Session State + Global Instructions</text>

  <!-- STEP 1 CARD: Local Session State + Switch -->
  <g transform="translate(44, 156)">
    <rect width="340" height="230" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="38" rx="14" fill="#1E293B"/>
    <circle cx="20" cy="19" r="6" fill="#EF4444"/>
    <circle cx="38" cy="19" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="19" r="6" fill="#10B981"/>
    <text x="76" y="24" class="card-title">1. global.instructions.md</text>

    <!-- Animated Switch Pill -->
    <rect x="20" y="54" width="300" height="44" rx="10" fill="#064E3B" fill-opacity="0.55" stroke="#34D399" stroke-width="1.5"/>
    <text x="34" y="81" class="code"><tspan class="code-kw">TOKENOMICS_SWITCH:</tspan> <tspan class="code-on">ON</tspan></text>
    <rect x="256" y="64" width="48" height="24" rx="12" fill="#10B981"/>
    <circle cx="292" cy="76" r="9" fill="#FFFFFF" class="pulse-dot"/>

    <text x="20" y="124" class="code" fill="#94A3B8"># Auto-reads local Copilot stream:</text>
    <text x="20" y="146" class="code"><tspan fill="#38BDF8">~/.copilot/session-state/</tspan></text>
    <text x="20" y="166" class="code"><tspan fill="#FBBF24">  └── &lt;session-id&gt;/events.jsonl</tspan></text>
    <text x="20" y="196" class="code" fill="#A7F3D0">✓ Pure Python 3 Standard Library</text>
    <text x="20" y="216" class="code" fill="#A7F3D0">✓ Flip ON/OFF anytime in 1 second</text>
  </g>

  <!-- Animated Connector 1 -> 2 -->
  <path d="M 384 271 L 430 271" class="flow-line"/>
  <polygon points="428,265 440,271 428,277" fill="#818CF8"/>

  <!-- STEP 2 CARD: Python Engine -->
  <g transform="translate(442, 156)">
    <rect width="316" height="230" rx="14" fill="url(#cardGrad)" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="0" y="0" width="316" height="38" rx="14" fill="#1E293B"/>
    <text x="20" y="24" class="card-title">2. update-tokenomics.py</text>

    <text x="20" y="64" class="code"><tspan class="code-kw">$ python</tspan> update-tokenomics.py</text>
    <rect x="20" y="78" width="276" height="1" fill="#334155"/>

    <text x="20" y="102" class="code">• Parses <tspan class="code-val">user.message</tspan> &amp; turns</text>
    <text x="20" y="124" class="code">• Aggregates <tspan class="code-val">session.usage_record</tspan></text>
    <text x="20" y="146" class="code">• Reconciles settled tool calls</text>
    <text x="20" y="168" class="code">• Computes Cache Hit % &amp; AIU</text>

    <!-- Animated Progress Bar -->
    <text x="20" y="194" class="metric-lbl">PROMPT CACHE HIT EFFICIENCY: 98.78%</text>
    <rect x="20" y="202" width="278" height="12" rx="6" fill="#1E293B"/>
    <rect x="20" y="202" width="268" height="12" rx="6" fill="url(#accentGrad)" class="bar-anim"/>
  </g>

  <!-- Animated Connector 2 -> 3 -->
  <path d="M 758 271 L 804 271" class="flow-line"/>
  <polygon points="802,265 814,271 802,277" fill="#34D399"/>

  <!-- STEP 3 CARD: 29-Column CSV + Chat Summary -->
  <g transform="translate(816, 156)">
    <rect width="340" height="230" rx="14" fill="url(#cardGrad)" stroke="#34D399" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="38" rx="14" fill="#1E293B"/>
    <text x="20" y="24" class="card-title">3. Daily CSV + Chat Summary</text>

    <text x="20" y="64" class="code"><tspan class="code-on">## Tokenomics</tspan> (in VS Code Chat)</text>
    <text x="20" y="88" class="code">Model:       <tspan class="code-val">Gemini 4 / Claude / GPT</tspan></text>
    <text x="20" y="108" class="code">Input / Hit: <tspan class="code-val">1,470,171 (98.78%)</tspan></text>
    <text x="20" y="128" class="code">Output/Reas: <tspan class="code-val">1,637 / 2,719</tspan></text>
    <text x="20" y="148" class="code">NanoAIU:     <tspan class="code-val">19,735,150,000</tspan></text>
    <text x="20" y="168" class="code">AIU Credits: <tspan class="code-on">19.735150 AIU</tspan></text>
    <rect x="20" y="184" width="300" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="32" y="205" class="code" fill="#38BDF8">📄 tokenomics-20261024.csv (29 cols)</text>
  </g>

  <!-- Bottom KPI Strip (29-Column Highlights) -->
  <g transform="translate(44, 414)">
    <rect width="1112" height="176" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="34" class="card-title" fill="#38BDF8">29-COLUMN ENTERPRISE TELEMETRY SCHEMA — CAPTURED AUTOMATICALLY ON EVERY PROMPT</text>

    <!-- 4 KPI Boxes -->
    <g transform="translate(24, 52)">
      <rect width="252" height="102" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="28" class="metric-lbl">MODELS &amp; ROUTING (6 COLS)</text>
      <text x="16" y="60" class="metric-val" fill="#38BDF8">Router + Source</text>
      <text x="16" y="84" class="code" fill="#64748B">initiator, effort, api_calls</text>
    </g>

    <g transform="translate(294, 52)">
      <rect width="252" height="102" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="28" class="metric-lbl">TOKEN ECONOMICS (8 COLS)</text>
      <text x="16" y="60" class="metric-val" fill="#818CF8">Cache &amp; Reasoning</text>
      <text x="16" y="84" class="code" fill="#64748B">input, uncached, read, out, tool</text>
    </g>

    <g transform="translate(564, 52)">
      <rect width="252" height="102" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="28" class="metric-lbl">BILLING &amp; AIU CREDITS (4 COLS)</text>
      <text x="16" y="60" class="metric-val" fill="#34D399">NanoAIU &amp; AIU</text>
      <text x="16" y="84" class="code" fill="#64748B">multiplier, cost, total_aiu</text>
    </g>

    <g transform="translate(834, 52)">
      <rect width="252" height="102" rx="10" fill="#0F172A" stroke="#1E293B"/>
      <text x="16" y="28" class="metric-lbl">LATENCY &amp; TOOLS (6 COLS)</text>
      <text x="16" y="60" class="metric-val" fill="#FBBF24">TTFT &amp; Tool Map</text>
      <text x="16" y="84" class="code" fill="#64748B">duration_ms, ttft_ms, tools</text>
    </g>
  </g>
</svg>
